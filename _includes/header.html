<header class="site-header wrap">
  <a class="brand" href="{{ '/' | relative_url }}">
    <img src="{{ '/assets/img/mascot.png' | relative_url }}" alt="" width="45" height="60">
    <span>{{ site.title }}</span>
  </a>
  <button class="menu-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="site-menu">
    <svg class="icon-open" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 9h14M5 15h14"/></svg>
    <svg class="icon-close" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <nav id="site-menu" class="menu" aria-label="Main" hidden>
    <a href="{{ '/' | relative_url }}">Home</a>
    {% for c in site.categories_list %}<a href="{{ '/' | relative_url }}?cat={{ c | uri_escape }}#posts">{{ c }}</a>
    {% endfor %}<a href="{{ '/' | relative_url }}#about">About</a>
  </nav>
</header>
